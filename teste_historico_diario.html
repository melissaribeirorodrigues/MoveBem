<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Histórico Diário</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 8px; margin: 5px 0; }
        button { background: #007cba; color: white; border: none; cursor: pointer; }
        button:hover { background: #005a87; }
        .resultado { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        .erro { background: #ffe6e6; color: #d00; }
        .sucesso { background: #e6ffe6; color: #080; }
        .detalhes { margin-top: 10px; }
        .registro { background: white; padding: 10px; margin: 5px 0; border-left: 3px solid #007cba; }
        pre { background: #f0f0f0; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Teste Histórico Diário - MoveBem</h1>
        
        <form id="testeForm">
            <div class="form-group">
                <label for="id_usuario">ID do Usuário:</label>
                <input type="number" id="id_usuario" name="id_usuario" value="1" required>
            </div>
            
            <div class="form-group">
                <label for="data">Data (YYYY-MM-DD):</label>
                <input type="date" id="data" name="data" value="2025-09-18" required>
            </div>
            
            <button type="submit">🔍 Testar API</button>
        </form>
        
        <div id="resultado" class="resultado" style="display: none;"></div>
    </div>

    <script>
        document.getElementById('testeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id_usuario = document.getElementById('id_usuario').value;
            const data = document.getElementById('data').value;
            const resultadoDiv = document.getElementById('resultado');
            
            // Mostrar loading
            resultadoDiv.style.display = 'block';
            resultadoDiv.innerHTML = '⏳ Testando API...';
            resultadoDiv.className = 'resultado';
            
            try {
                // URL da API
                const url = `Controller/CrudHistoricoDiario.php?id_usuario=${id_usuario}&data=${data}&oper=ResumoPorData`;
                console.log('🔗 URL da API:', url);
                
                // Fazer requisição
                const response = await fetch(url);
                console.log('📡 Status da resposta:', response.status);
                console.log('📋 Headers:', response.headers);
                
                // Verificar se a resposta é OK
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                // Pegar o texto bruto primeiro
                const textoResposta = await response.text();
                console.log('📄 Resposta bruta:', textoResposta);
                
                // Tentar fazer parse do JSON
                let dados;
                try {
                    dados = JSON.parse(textoResposta);
                } catch (jsonError) {
                    console.error('❌ Erro ao fazer parse do JSON:', jsonError);
                    resultadoDiv.className = 'resultado erro';
                    resultadoDiv.innerHTML = `
                        <h3>❌ Erro no JSON!</h3>
                        <p><strong>Erro:</strong> ${jsonError.message}</p>
                        <p><strong>Resposta do servidor:</strong></p>
                        <pre>${textoResposta}</pre>
                    `;
                    return;
                }
                
                // Exibir resultado
                if (dados.sucesso) {
                    resultadoDiv.className = 'resultado sucesso';
                    
                    let html = `
                        <h3>✅ Teste SUCESSO!</h3>
                        <p><strong>Data:</strong> ${dados.data}</p>
                        
                        <div style="display: flex; gap: 20px; margin: 15px 0;">
                            <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; flex: 1;">
                                <h4>💧 Água</h4>
                                <p><strong>Total:</strong> ${dados.total_agua_ml} ml</p>
                                <p><strong>Registros:</strong> ${dados.total_registros}</p>
                            </div>
                            <div style="background: #f3e5f5; padding: 15px; border-radius: 8px; flex: 1;">
                                <h4>🏃‍♂️ Exercícios</h4>
                                <p><strong>Total:</strong> ${dados.total_minutos_exercicio || 0} min</p>
                                <p><strong>Registros:</strong> ${dados.total_registros_exercicio || 0}</p>
                            </div>
                        </div>
                    `;
                    
                    if (dados.detalhes && dados.detalhes.length > 0) {
                        html += '<div class="detalhes"><h4>📋 Detalhes dos Registros de Água:</h4>';
                        dados.detalhes.forEach((registro, index) => {
                            const dataHora = new Date(registro.dh_ingestao_agua).toLocaleString('pt-BR');
                            html += `
                                <div class="registro">
                                    <strong>Registro ${index + 1}:</strong> ${registro.qt_agua_ml} ml 
                                    <br><small>🕐 ${dataHora}</small>
                                </div>
                            `;
                        });
                        html += '</div>';
                    } else {
                        html += '<p>ℹ️ Nenhum registro de água encontrado para esta data.</p>';
                    }
                    
                    // JSON completo
                    html += `
                        <details>
                            <summary>📄 Ver JSON Completo</summary>
                            <pre>${JSON.stringify(dados, null, 2)}</pre>
                        </details>
                    `;
                    
                    resultadoDiv.innerHTML = html;
                } else {
                    resultadoDiv.className = 'resultado erro';
                    resultadoDiv.innerHTML = `
                        <h3>❌ Erro no Teste!</h3>
                        <p><strong>Erro:</strong> ${dados.erro}</p>
                        <details>
                            <summary>📄 Ver Resposta Completa</summary>
                            <pre>${JSON.stringify(dados, null, 2)}</pre>
                        </details>
                    `;
                }
                
            } catch (error) {
                resultadoDiv.className = 'resultado erro';
                resultadoDiv.innerHTML = `
                    <h3>❌ Erro de Conexão!</h3>
                    <p><strong>Erro:</strong> ${error.message}</p>
                    <p>Verifique se o servidor está rodando e a URL está correta.</p>
                `;
            }
        });
    </script>
</body>
</html>
