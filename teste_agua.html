<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveBem - Teste de Registro de Água</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF70A8 0%, #FF8FB8 50%, #FFB3C8 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(255, 112, 168, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #FF70A8, #FF8FB8);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            background: white;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(255, 112, 168, 0.1);
            overflow: hidden;
            border: 2px solid #FFE4ED;
        }

        .section-header {
            background: linear-gradient(90deg, #FF70A8, #FF8FB8);
            color: white;
            padding: 20px;
            font-size: 1.3em;
            font-weight: bold;
        }

        .section-content {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #FF70A8;
            font-size: 1.1em;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #FFB3D1;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #FFEEF5;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #FF70A8;
            box-shadow: 0 0 0 3px rgba(255, 112, 168, 0.2);
            background: white;
        }

        .btn {
            background: linear-gradient(45deg, #FF70A8, #FF8FB8);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 112, 168, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 112, 168, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .response-area {
            background: #FFEEF5;
            border: 2px solid #FFB3D1;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .url-display {
            background: #FF70A8;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            word-break: break-all;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #FFB3D1;
            border-radius: 50%;
            border-top-color: #FF70A8;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-online { background: #28a745; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MoveBem - Registro de Água</h1>
            <p>Registre seu consumo diário de água</p>
        </div>

        <div class="content">
            <!-- URL Display -->
            <div class="url-display" id="currentUrl">
                <span class="status-indicator status-online"></span>
                Detectando ambiente...
            </div>

            <!-- Registro Simples -->
            <div class="section">
                <div class="section-header">
                    Registrar Consumo de Água
                </div>
                <div class="section-content">
                    <div class="form-group">
                        <label>Usuário:</label>
                        <select id="idUsuario">
                            <option value="">Carregando usuários...</option>
                        </select>
                        <button class="btn" onclick="carregarUsuarios()" style="margin-top: 5px; padding: 8px 15px; font-size: 12px;">
                            Recarregar Lista
                        </button>
                    </div>

                    <div class="form-group">
                        <label>Quantidade de água (ml):</label>
                        <input type="number" id="quantidade" placeholder="Ex: 250" min="1" max="5000">
                    </div>

                    <div class="form-group">
                        <label>Quantidades rápidas:</label>
                        <div style="margin-top: 10px;">
                            <button class="btn" onclick="setQuantidade(100)">100ml</button>
                            <button class="btn" onclick="setQuantidade(200)">200ml</button>
                            <button class="btn" onclick="setQuantidade(250)">250ml</button>
                            <button class="btn" onclick="setQuantidade(300)">300ml</button>
                            <button class="btn" onclick="setQuantidade(500)">500ml</button>
                            <button class="btn" onclick="setQuantidade(1000)">1L</button>
                        </div>
                    </div>

                    <div style="margin-top: 30px;">
                        <button class="btn" onclick="registrarConsumo()" style="font-size: 1.2em; padding: 15px 30px;">
                            Registrar Consumo
                        </button>
                        <button class="btn" onclick="limparFormulario()">
                            Limpar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Response Area -->
            <div class="section">
                <div class="section-header">
                    Resultado
                </div>
                <div class="section-content">
                    <div class="response-area" id="response">Pronto para registrar consumo...</div>
                </div>
            </div>

            <!-- Ferramentas de Cache -->
            <div class="section">
                <div class="section-header">
                    🛠️ Ferramentas de Cache
                </div>
                <div class="section-content">
                    <button class="btn" onclick="limparCache()" style="background: #17a2b8;">
                        🧹 Limpar Cache
                    </button>
                    <button class="btn" onclick="forcarReload()" style="background: #28a745;">
                        🔄 Forçar Reload
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let baseUrl = '';

        // Função universal para fazer requisições com cache busting
        async function fazerRequest(url, options = {}) {
            // Adiciona timestamp e ID aleatório para quebrar cache
            const separator = url.includes('?') ? '&' : '?';
            const cacheBuster = `${separator}t=${Date.now()}&r=${Math.random()}`;
            const finalUrl = url + cacheBuster;
            
            // Garante headers anti-cache
            const defaultHeaders = {
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache',
                'Expires': '0'
            };
            
            if (options.headers) {
                options.headers = { ...defaultHeaders, ...options.headers };
            } else {
                options.headers = defaultHeaders;
            }
            
            return fetch(finalUrl, options);
        }

        // Função para limpar cache do navegador
        function limparCache() {
            try {
                // Limpa localStorage
                localStorage.clear();
                
                // Limpa sessionStorage
                sessionStorage.clear();
                
                // Limpa cache do service worker se existir
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister();
                        }
                    });
                }
                
                // Limpa cache da aplicação se existir
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        for (let name of names)
                            caches.delete(name);
                    });
                }
                
                alert('✅ Cache limpo com sucesso! A página será recarregada.');
                setTimeout(() => {
                    window.location.reload(true);
                }, 1000);
                
            } catch (error) {
                console.error('Erro ao limpar cache:', error);
                alert('⚠️ Erro ao limpar cache: ' + error.message);
            }
        }

        // Função para forçar reload completo
        function forcarReload() {
            // Adiciona timestamp na URL para forçar reload
            const url = new URL(window.location);
            url.searchParams.set('nocache', Date.now());
            window.location.href = url.toString();
        }

        // Detecta o ambiente e define a URL base
        function detectarAmbiente() {
            const hostname = window.location.hostname;
            const origin = window.location.origin;
            
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                baseUrl = 'http://localhost/MoveBem/Controller/';
                document.getElementById('currentUrl').innerHTML = 
                    '<span class="status-indicator status-online"></span>💻 LOCALHOST: ' + baseUrl;
            } else if (hostname === '192.168.20.19') {
                baseUrl = origin + '/usuario03/MoveBem/Controller/';
                document.getElementById('currentUrl').innerHTML = 
                    '<span class="status-indicator status-online"></span>🏢 SERVIDOR INTERNO: ' + baseUrl;
            } else if (hostname === '200.19.1.19') {
                baseUrl = origin + '/usuario03/MoveBem/Controller/';
                document.getElementById('currentUrl').innerHTML = 
                    '<span class="status-indicator status-online"></span>🌐 SERVIDOR EXTERNO: ' + baseUrl;
            } else {
                baseUrl = origin + '/usuario03/MoveBem/Controller/';
                document.getElementById('currentUrl').innerHTML = 
                    '<span class="status-indicator status-online"></span>❓ SERVIDOR: ' + baseUrl;
            }
        }

        // Função para obter URL da API
        function getAPIUrl() {
            if (!baseUrl) {
                detectarAmbiente();
            }
            return baseUrl;
        }

        // Define quantidade nos botões rápidos
        function setQuantidade(valor) {
            document.getElementById('quantidade').value = valor;
        }

        // Carregar usuários reais da base de dados
        async function carregarUsuarios() {
            const select = document.getElementById('idUsuario');
            const originalValue = select.value;
            
            select.innerHTML = '<option value="">Carregando...</option>';

            try {
                const response = await fazerRequest(baseUrl + 'CrudUsuario.php', {
                    method: 'POST',
                    body: new URLSearchParams({
                        oper: 'Listar'
                    })
                });

                const data = await response.json();
                
                if (data.NumMens && data.dados && Array.isArray(data.dados)) {
                    select.innerHTML = '<option value="">Selecione um usuário...</option>';
                    
                    data.dados.forEach(usuario => {
                        const option = document.createElement('option');
                        option.value = usuario.id_usuario;
                        option.textContent = `${usuario.nm_usuario} (${usuario.ds_email})`;
                        select.appendChild(option);
                    });

                    // Restaura seleção anterior se existir
                    if (originalValue) {
                        select.value = originalValue;
                    }

                    document.getElementById('response').innerHTML = 
                        `<div class="success">✅ ${data.dados.length} usuários carregados com sucesso!</div>`;
                } else {
                    select.innerHTML = '<option value="">Erro ao carregar usuários</option>';
                    document.getElementById('response').innerHTML = 
                        `<div class="error">❌ ERRO: ${data.Mensagem || 'Não foi possível carregar a lista de usuários'}</div>`;
                }
            } catch (error) {
                select.innerHTML = '<option value="">Erro de conexão</option>';
                document.getElementById('response').innerHTML = 
                    `<div class="error">❌ ERRO: ${error.message}</div>`;
            }
        }

        // Registrar consumo de água
        async function registrarConsumo() {
            const userId = document.getElementById('idUsuario').value;
            const quantidade = document.getElementById('quantidade').value;
            const responseDiv = document.getElementById('response');

            // Validações
            if (!userId) {
                responseDiv.innerHTML = '<span class="error">Selecione um usuário</span>';
                return;
            }

            if (!quantidade || quantidade <= 0) {
                responseDiv.innerHTML = '<span class="error">Informe uma quantidade válida</span>';
                return;
            }

            // Obter nome do usuário selecionado
            const selectUsuario = document.getElementById('idUsuario');
            const nomeUsuario = selectUsuario.options[selectUsuario.selectedIndex].text;

            responseDiv.innerHTML = '<div class="loading"></div>Registrando consumo...';

            try {
                const response = await fazerRequest(baseUrl + 'CrudRegistroAgua.php', {
                    method: 'POST',
                    body: new URLSearchParams({
                        oper: 'Inserir',
                        id_usuario: userId,
                        qt_agua_ml: quantidade
                    })
                });

                const data = await response.json();
                
                if (data.NumMens) {
                    responseDiv.innerHTML = `<div class="success">
✅ SUCESSO: ${data.Mensagem}

Registro salvo:
• Usuário: ${nomeUsuario}
• Quantidade: ${quantidade}ml
• Data/Hora: ${new Date().toLocaleString('pt-BR')}
                    </div>`;
                    
                    // Limpa o campo quantidade após sucesso
                    document.getElementById('quantidade').value = '';
                } else {
                    responseDiv.innerHTML = `<div class="error">❌ ERRO: ${data.Mensagem}</div>`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<span class="error">❌ ERRO: ${error.message}</span>`;
            }
        }

        // Limpar formulário
        function limparFormulario() {
            document.getElementById('idUsuario').value = '';
            document.getElementById('quantidade').value = '';
            document.getElementById('response').innerHTML = 'Pronto para registrar consumo...';
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            detectarAmbiente();
            document.getElementById('response').innerHTML = 'Carregando usuários...';
            
            // Carrega a lista de usuários automaticamente
            carregarUsuarios();
        });

        // Enter para submeter
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                registrarConsumo();
            }
        });
    </script>
</body>
</html>
